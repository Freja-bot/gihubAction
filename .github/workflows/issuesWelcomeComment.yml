name: Issue welcome commenter
permissions:
    issues: write
on: 
    issues:
        types: [opened]

jobs:
    comment:
        runs-on: ubuntu-latest
        steps:
            - name: "Dump Github context"
              run: echo "Welcome ${{ toJson(github.event.issue.author_association) }} You have created issue number ${{ toJson(github.event.issue.number) }}"
